<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nocturne tests</title><style>body{background:#11101b;color:#f3ecdd;font:15px system-ui;max-width:760px;margin:32px auto;padding:0 20px}h1{color:#cbb27a}li{padding:9px;border-bottom:1px solid #383247}.ok{color:#92ad9b}.fail{color:#e69b9b}</style><h1>Проверка логики Nocturne</h1><ol id="results"></ol><script>(async()=>{const out=document.querySelector('#results');let ok=0,bad=0;function t(n,f){try{if(!f())throw Error();ok++;out.insertAdjacentHTML('beforeend',`<li class="ok">✓ ${n}</li>`)}catch{bad++;out.insertAdjacentHTML('beforeend',`<li class="fail">✗ ${n}</li>`)}}const [c,s,appSrc,htmlSrc]=await Promise.all([fetch('cards.json').then(r=>r.json()),fetch('spreads.json').then(r=>r.json()),fetch('app.js').then(r=>r.text()),fetch('index.html').then(r=>r.text())]);t('78 карт',()=>c.length===78);t('Уникальные ID',()=>new Set(c.map(x=>x.id)).size===78);t('22 Старших и 56 Младших арканов',()=>c.filter(x=>x.arcana==='Старший аркан').length===22&&c.filter(x=>x.arcana==='Младший аркан').length===56);t('Полнота основных полей значений',()=>c.every(x=>['core','relationships','thoughts','actions','work','obstacles','result','positive','shadow','limits','source','version','updated'].every(k=>x[k])));t('Нет модели перевёрнутого положения',()=>c.every(x=>!('orientation'in x)&&!('reversedMeaning'in x)));t('10 раскладов с корректными позициями',()=>s.length===10&&s.every(x=>x.positions.length===x.count&&x.positions.every(p=>p[0]&&p[1]&&p[2])));t('56 Младших названы в родительном падеже',()=>c.filter(x=>x.arcana==='Младший аркан').every(x=>/(Жезлов|Кубков|Мечей|Пентаклей)$/.test(x.name)));t('Нет двойных точек в positive/shadow',()=>c.every(x=>!x.positive.includes('..')&&!x.shadow.includes('..')));t('Все 34 combo-ссылки ведут на существующие карты',()=>{const names=new Set(c.map(x=>x.name.toLowerCase()));const combo=appSrc.slice(appSrc.indexOf('const comboCues = []'),appSrc.indexOf('// V26:'));const used=[];let m;const rx=/has\("([^"]+)"\)/g;while((m=rx.exec(combo)))used.push(m[1].toLowerCase());return used.length===34&&used.every(n=>names.has(n))});t('CSP запрещает inline-скрипты',()=>htmlSrc.includes("script-src 'self'")&&!htmlSrc.includes('<script>if("serviceWorker"'));t('Равные критерии сравнения A/B',()=>{let x=s.find(x=>x.id==='compare');return x.positions.slice(0,4).map(p=>p[1].split('—')[1].trim()).join('|')===x.positions.slice(4).map(p=>p[1].split('—')[1].trim()).join('|')});function pick(n){const x=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(x)}while(x[0]>=lim);return x[0]%n}function sh(a){for(let i=a.length-1;i>0;i--){let j=pick(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}t('100 пробных раздач без повторов',()=>{for(let i=0;i<100;i++)if(new Set(sh([...c]).slice(0,10).map(x=>x.id)).size!==10)return false;return true});out.insertAdjacentHTML('beforeend',`<li class="${bad?'fail':'ok'}"><b>Итог: ${ok} пройдено, ${bad} ошибок</b></li>`)})()</script></html>
