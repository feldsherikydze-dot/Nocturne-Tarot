name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine and UI tests
        run: node engine-tests.js
      - name: Service Worker tests
        run: node sw-tests.js
      - name: Data safety tests
        run: node data-safety-tests.js
      - name: Deck structure audit
        run: python audit-cards.py
        env:
          PYTHONIOENCODING: utf-8
